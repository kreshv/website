<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>
    <style>
      :root {
        --bg-start: #ffffff;
        --bg-end: #fffaf0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, var(--bg-start), var(--bg-end));
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }

      .search-shell {
        width: min(760px, 92vw);
      }

      .search-form {
        display: grid;
        position: relative;
      }

      .criteria-wrap {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      .criteria-input {
        flex: 1 1 auto;
        min-height: 78px;
        max-height: 180px;
        border: 1px solid #d5bfa0;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 14px;
        font-family: inherit;
        line-height: 1.5;
        color: #2d2a26;
        background: rgba(255, 249, 239, 0.95);
        resize: none;
        outline: none;
        transition: border-color 160ms ease, box-shadow 160ms ease;
        box-shadow: 0 8px 24px rgba(130, 108, 78, 0.08);
      }

      .criteria-input:focus {
        border-color: #b89a78;
        box-shadow: 0 10px 28px rgba(130, 108, 78, 0.13);
      }

      .criteria-submit {
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        border: none;
        border-radius: 999px;
        background: #3f3224;
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background-color 140ms ease, transform 120ms ease;
        margin-bottom: 4px;
      }

      .criteria-submit:hover {
        background: #28201a;
      }

      .criteria-submit:active {
        transform: scale(0.94);
      }

      .criteria-submit:disabled {
        background: #c8b99e;
        color: #f4ece0;
        cursor: not-allowed;
        transform: none;
      }

      .criteria-submit:focus-visible {
        outline: 2px solid #6e655a;
        outline-offset: 2px;
      }

      .criteria-submit svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <main class="search-shell">
      <form class="search-form" action="apartments.html" method="get">
        <div class="criteria-wrap">
          <textarea
            class="criteria-input"
            name="q"
            placeholder="What type of apartment are you looking for, which boroughs and neighborhoods, and what's your budget? Please include any additional details."
            aria-label="Apartment search criteria"
          ></textarea>
          <button class="criteria-submit" type="submit" aria-label="Search apartments" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5"></path>
              <path d="M6.5 10.5 12 5l5.5 5.5"></path>
            </svg>
          </button>
        </div>
      </form>
    </main>
    <script>
      const form = document.querySelector(".search-form");
      const textarea = document.querySelector(".criteria-input");
      const submitButton = document.querySelector(".criteria-submit");

      function syncSubmitButtonState() {
        const hasText = textarea.value.trim().length > 0;
        submitButton.disabled = !hasText;
      }

      // Press Enter to submit; use Shift+Enter for a new line.
      textarea.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          if (!textarea.value.trim()) return;
          event.preventDefault();
          form.requestSubmit();
        }
      });

      textarea.addEventListener("input", syncSubmitButtonState);
      form.addEventListener("submit", (event) => {
        if (!textarea.value.trim()) event.preventDefault();
      });

      syncSubmitButtonState();
    </script>
  </body>
</html>
